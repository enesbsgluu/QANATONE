<!--
  GIRIS SAHNESI PROTOTIPI (28 Agu 2026) — DEVIR-SPESIFIKASYONU §2 BAGLAYICI.
  AYRI SAYFA: film sayfasina BAGLI DEGIL, nav gercek Nav.astro degil (olculeriyle
  kurulmus KOPYA: .nv-bar 20px pad, .nv-ic 1180 max, logo img 29px). Deploy yok.

  TEK WebGL KATMANI, uc faz ayni malzemede (§2: bolunmez, yeniden mount yok):
    Faz A  Q amblemi VEKTOREL cizilir: once halka, sonra kuyruk (kanalin
           kazilmasi). Cizim ilerlemesi = varlik on-yukleme ilerlemesi (bayt),
           gorunur olsun diye alt sure tabani (?cizim_min, sn).
    Faz B  Yukleme bitince cizgi KABARIR: ayni quad, uKabar 0->1; kenar
           yumusatma cizgi dokusundan SDF'e, normal duz'den pah egimine,
           renk duz kizildan metale (metal.ts FS'nin Three/GLSL3 tasinmasi:
           SDF pah normali + envmap (sahne karesi + gunes lekesi + ufuk bandi
           + gok) + gunes huzmesi + tek saat salinim, pivot kuyruk ucu).
    Faz C  Amblem CANLI dag ortaminda durur. Arka plan = SAHNE1'IN ILK
           KARESI (encode edilmis klibin posteri, ayni kadraj); kamera nefesi
           (perspektif kamera kucuk salinim) + amblemin kendi salinimi.
  ILK KAYDIRMA: iki hareket AYNI ANDA: amblem navdaki yerine ucar (ikinci
  logo cizilmez: navdaki <img> ucus bitene kadar gorunmez, amblem oturunca
  quad kapanir, img acilir — halka.ts kurali) ve kamera harekete baslar
  (DAGA DALMAZ, kanal hizasinda asagi iner: burada VIDEO YOK, kamera nefes
  duzlemi uzerinde asagi/ileri kayar — film scrub'inin YER TUTUCUSU).

  Ayarlar (URL): ?cizim_min=1.6 &kabar=1.2 &ucus=0.6 (ucus kaydirmasi, ekran
  boyu) &nefes=1 &dpr=2 &hud=1
-->
<style>

  .nv-logo.acik i img{opacity:1}

<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const P = {
  cizimMin: +(q.get('cizim_min') ?? 1.6),   /* Faz A alt sure tabani (sn) */
  kabarS:   +(q.get('kabar') ?? 1.2),       /* Faz B suresi (sn) */
  ucus:     +(q.get('ucus') ?? 0.6),        /* ucus = bu kadar ekran boyu kaydirma */
  nefes:    +(q.get('nefes') ?? 1),
  dprTavan: +(q.get('dpr') ?? 2),
  hud:      q.get('hud') !== '0',
};
const AZALT = matchMedia('(prefers-reduced-motion:reduce)').matches;
const hud = document.getElementById('hud'), not = document.getElementById('not');
const yaz = (s) => { if (P.hud) hud.textContent = s; };
addEventListener('error', (e) => yaz('HATA ' + e.message));
addEventListener('unhandledrejection', (e) => yaz('RED ' + (e.reason && e.reason.message || e.reason)));

/* ---------- KUNYE (sahne.json durak2.metal + amblem-sdf-kunye, kopya degil: sayilar kaynagiyla etiketli) ---------- */
const KUTU = 1254;
const M = { /* sahne.json durak2.metal (24 Agu, kilitli) */
  periyot_s: 12.08, env_donus: 0.55, salinim: [0.09, 0.16], puruz: 0.15, kaplama: 0.5, kaplama_puruz: 0.14,
  env_kazanc: 2.4, pah_birim: 7.0, bant_birim: 12.0, gunes_uv: [0.62, 0.46], gunes_guc: 3.0,
  renk: [0.937, 0.137, 0.235], uc: [1022.0, 1059.0], tumsek: 0.22, dip: 0.1, merkez: [0.492, 0.484], band_guc: 0.8,
};
const SDF = { dosya: '../../img/prolog/amblem-sdf-d1216.webp', N: 1216 }; /* amblem-sdf-kunye masaustu */
const ARKA = '../../varlik/film/sahne1-poster.webp';                       /* sahne1 ilk karesi (encode edilmis klip posteri) */
/* yerlesim: amblem-sdf-kunye masaustu turetimi kutu_css 585,6 @ kh 1028,7 -> kutu = 0,569 x yukseklik;
   sahne.json kesim masaustu v 0,546 (amblem merkezi dikeyde), yatay merkez pazarliksiz (Enes, 24 Agu) */
const YER = { kutuOran: 0.569, v: 0.546, mobilV: 0.5865, mobilKutuW: 0.86 };

/* ---------- yukleme (bayt ilerlemesi -> cizim) ---------- */
let yuklenen = 0, toplamBayt = 0; const yukler = [];
async function indir(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
  const n = +(r.headers.get('content-length') || 0); toplamBayt += n;
  const rd = r.body.getReader(); const parca = [];
  for (;;) { const { done, value } = await rd.read(); if (done) break; parca.push(value); yuklenen += value.length; }
  return new Blob(parca);
}
const bitmap = async (url, opt) => createImageBitmap(await indir(url), opt);
const amblemP = fetch('./amblem.json').then((r) => r.json());
const sdfP = bitmap(SDF.dosya, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
const arkaP = bitmap(ARKA);

/* ---------- renderer ---------- */
const cnv = document.getElementById('sahne');
const renderer = new THREE.WebGLRenderer({ canvas: cnv, antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, P.dprTavan));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const gpuAdi = (() => { try { const g = renderer.getContext(); const d = g.getExtension('WEBGL_debug_renderer_info'); return d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : '?'; } catch { return '?'; } })();

/* ---------- arka plan: sahne1 ilk karesi, perspektif kamera, nefes ---------- */
const bgScene = new THREE.Scene();
const bgCam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 10);
bgCam.position.set(0, 0, 1);
let bgMesh = null, arkaTex = null;
function bgYerlestir() {
  if (!bgMesh) return;
  /* z=0 duzlemi kamera z=1'den: gorunen yukseklik 2*tan(fov/2); cover + %8 pay (nefes/kayma kenar acmasin) */
  const H = 2 * Math.tan(THREE.MathUtils.degToRad(bgCam.fov / 2)), W = H * bgCam.aspect;
  const oran = arkaTex.image.width / arkaTex.image.height;
  let ph = H, pw = H * oran; if (pw < W) { pw = W; ph = W / oran; }
  bgMesh.scale.set(pw * 1.08, ph * 1.08, 1);
}

/* ---------- amblem: tek quad, tek malzeme (cizgi -> metal) ---------- */
const VS = /* glsl */`
  uniform mat3 uM; uniform vec2 uEkran;
  out vec2 vUV;
  void main(){
    vec2 aG = vec2(uv.x, 1.0 - uv.y);          /* y=0 ust: SDF/cizim dokusu satir 0 ustte */
    vUV = aG;
    vec3 c = uM * vec3(aG * ${KUTU}.0, 1.0);    /* birim -> cihaz pikseli */
    vec2 n = c.xy / uEkran * 2.0 - 1.0;
    gl_Position = vec4(n.x, -n.y, 0.0, 1.0);
  }`;
const FS = /* glsl */`
  precision highp float;
  uniform sampler2D uSDF, uEnv, uCizim;
  uniform float uPpb, uTexel, uOpak, uDonus, uPah, uBant, uPuruz, uKapla, uKaplaPuruz, uKazanc, uGunesGuc, uTumsek, uDip, uKabar;
  uniform vec2 uMerkez; uniform vec3 uRenk, uGunes; uniform mat3 uEgim;
  in vec2 vUV; out vec4 renk;
  float d(vec2 uv){ return texture(uSDF, uv).r * (2.0 * uBant) - uBant; }
  vec3 env(vec3 R, float lod){
    float u = atan(R.x, R.z) / 6.2831853 + 0.5 + uDonus;
    float v = 0.5 - asin(clamp(R.y, -1.0, 1.0)) / 3.1415927;
    return textureLod(uEnv, vec2(u, v), lod).rgb;
  }
  void main(){
    float db = d(vUV), dp = db * uPpb;
    float ortSDF = clamp(dp + 0.5, 0.0, 1.0);                 /* SDF kenari: 1 px */
    float ortCiz = texture(uCizim, vUV).a;                     /* Faz A cizgisi */
    float ort = mix(ortCiz, ortSDF, uKabar);
    if (ort <= 0.002) discard;
    /* PAH NORMALI d'nin egiminden (metal.ts); kabarma normal genligini 0->1 acar */
    float e = uTexel * 0.75;
    vec2 g = vec2(d(vUV + vec2(e, 0.0)) - d(vUV - vec2(e, 0.0)), d(vUV + vec2(0.0, e)) - d(vUV - vec2(0.0, e))) / (2.0 * e * ${KUTU}.0);
    float t = clamp(db / uPah, 0.0, 1.0);
    float dz = 1.5707963 * cos(1.5707963 * t) * uKabar;
    vec2 tum = vec2(vUV.x - uMerkez.x, uMerkez.y - vUV.y) / 0.4 * uTumsek * uKabar;
    vec3 n = normalize(uEgim * vec3(-g.x * dz + tum.x, g.y * dz + tum.y, 1.0));
    vec3 V = vec3(0.0, 0.0, 1.0);
    float nv = max(dot(n, V), 0.0);
    vec3 R = 2.0 * nv * n - V;
    vec3 F0 = uRenk;
    vec3 F = F0 + (1.0 - F0) * pow(1.0 - nv, 5.0);
    vec3 c = env(R, uPuruz * 6.0) * uKazanc * F;
    c += uRenk * uDip;
    float Fc = 0.04 + 0.96 * pow(1.0 - nv, 5.0);
    c += env(R, uKaplaPuruz * 6.0) * uKazanc * Fc * uKapla;
    vec3 H = normalize(uGunes + V);
    float sp = pow(max(dot(n, H), 0.0), 160.0);
    c += vec3(1.0, 0.86, 0.66) * sp * uGunesGuc * F;
    c = c / (1.0 + c);
    /* Faz A/B: duz kizil cizgi -> metal */
    c = mix(uRenk, c, uKabar);
    c = pow(c, vec3(1.0 / 2.2));
    renk = vec4(c, ort * uOpak);
  }`;
const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
const U = {
  uM: { value: new THREE.Matrix3() }, uEkran: { value: new THREE.Vector2() }, uEgim: { value: new THREE.Matrix3() },
  uSDF: { value: null }, uEnv: { value: null }, uCizim: { value: null },
  uPpb: { value: 1 }, uTexel: { value: 1 / SDF.N }, uOpak: { value: 1 }, uDonus: { value: 0 },
  uPah: { value: M.pah_birim }, uBant: { value: M.bant_birim }, uPuruz: { value: M.puruz }, uKapla: { value: M.kaplama },
  uKaplaPuruz: { value: M.kaplama_puruz }, uKazanc: { value: 0 }, uGunesGuc: { value: M.gunes_guc },
  uTumsek: { value: M.tumsek }, uDip: { value: 0 }, uKabar: { value: 0 },
  uMerkez: { value: new THREE.Vector2(M.merkez[0], M.merkez[1]) },
  uRenk: { value: new THREE.Vector3(...M.renk.map(lin)) }, uGunes: { value: new THREE.Vector3(0, 0.55, 0.8).normalize() },
};
const amblemMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: VS, fragmentShader: FS, uniforms: U, transparent: true, depthTest: false, depthWrite: false });
const amblemScene = new THREE.Scene();
const amblemMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), amblemMat);
amblemMesh.frustumCulled = false; amblemScene.add(amblemMesh);
const bosCam = new THREE.Camera();

/* ---------- Faz A: cizim dokusu (canvas 2D, 1216 px, 1254 birim kutu) ---------- */
const CZ = SDF.N, cz = document.createElement('canvas'); cz.width = cz.height = CZ;
const cc = cz.getContext('2d');
const cizimTex = new THREE.CanvasTexture(cz); cizimTex.flipY = false; cizimTex.colorSpace = THREE.NoColorSpace;
cizimTex.minFilter = THREE.LinearFilter; cizimTex.generateMipmaps = false;
U.uCizim.value = cizimTex;
let yollar = null; /* {halka:[[x,y]...], kuyruk:[[x,y,w]...]} */
const parsePoly = (s) => s.trim().split(/[ML]\s*/).filter(Boolean).map((p) => p.trim().split(/\s+/).map(Number));
const uzunluk = (pts) => { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return L; };
function yollariKur(A) {
  const c2 = A.cizim2;
  const halka = parsePoly(c2.cember.yol);
  let kuyruk = parsePoly(c2.kuyruk.yol);
  /* kuyruk yolu ucta baslar; cizim govdeden uca (kanal kazilir) -> ters cevir */
  const ucBas = Math.hypot(kuyruk[0][0] - M.uc[0], kuyruk[0][1] - M.uc[1]) < Math.hypot(kuyruk[kuyruk.length - 1][0] - M.uc[0], kuyruk[kuyruk.length - 1][1] - M.uc[1]);
  if (ucBas) kuyruk = kuyruk.slice().reverse();
  yollar = { halka, halkaL: uzunluk(halka), halkaW: c2.cember.kalinlik, kuyruk, kuyrukL: uzunluk(kuyruk), wBas: c2.kuyruk.kalinlik_bas, wUc: c2.kuyruk.kalinlik_uc };
}
let sonCizim = -1;
function ciz(p) { /* p 0..1: halka 0..0.62, kuyruk 0.62..1 */
  if (!yollar || p === sonCizim) return; sonCizim = p;
  const k = CZ / KUTU;
  cc.setTransform(1, 0, 0, 1, 0, 0); cc.clearRect(0, 0, CZ, CZ); cc.setTransform(k, 0, 0, k, 0, 0);
  cc.lineCap = 'round'; cc.lineJoin = 'round'; cc.strokeStyle = '#fff';
  const kismi = (pts, L, oran, w) => { /* yolun ilk `oran` kismini ciz */
    const hedef = L[L.length - 1] * oran; if (hedef <= 0) return;
    cc.lineWidth = w; cc.beginPath(); cc.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      if (L[i] <= hedef) cc.lineTo(pts[i][0], pts[i][1]);
      else { const f = (hedef - L[i - 1]) / (L[i] - L[i - 1]); cc.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f); break; }
    }
    cc.stroke();
  };
  const ph = Math.min(1, p / 0.62), pk = Math.max(0, (p - 0.62) / 0.38);
  kismi(yollar.halka, yollar.halkaL, ph, yollar.halkaW);
  if (pk > 0) { /* kuyruk: kalinlik govdeden uca incelir; kisa parcalar, degisken genislik */
    const L = yollar.kuyrukL, top = L[L.length - 1], hedef = top * pk, pts = yollar.kuyruk;
    for (let i = 1; i < pts.length && L[i - 1] < hedef; i++) {
      const f = Math.min(1, (hedef - L[i - 1]) / (L[i] - L[i - 1]));
      const ux = L[i - 1] / top, w = yollar.wBas + (yollar.wUc - yollar.wBas) * ux;
      cc.lineWidth = Math.max(2, w * 0.35); /* dolgu kalinligi degil, KAZILAN cizgi: kalinligin ucte biri */
      cc.beginPath(); cc.moveTo(pts[i - 1][0], pts[i - 1][1]);
      cc.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f); cc.stroke();
    }
  }
  cizimTex.needsUpdate = true;
}

/* ---------- envmap: sahne karesi + gunes lekesi + ufuk bandi + gok (metal.ts LEKE_FS'nin canvas karsiligi), bir kez ---------- */
function envKur(bm) {
  const EW = 512, EH = 256, c = document.createElement('canvas'); c.width = EW; c.height = EH;
  const x = c.getContext('2d');
  x.drawImage(bm, 0, 0, EW, EH);                              /* sahne, v=0 ust (gok) */
  x.globalCompositeOperation = 'lighter';
  const leke = x.createRadialGradient(M.gunes_uv[0] * EW, M.gunes_uv[1] * EH, 0, M.gunes_uv[0] * EW, M.gunes_uv[1] * EH, 0.28 * EW);
  const gk = Math.min(1, M.gunes_guc / 3);
  leke.addColorStop(0, `rgba(255,219,173,${gk})`); leke.addColorStop(0.35, `rgba(255,219,173,${gk * 0.45})`); leke.addColorStop(1, 'rgba(255,219,173,0)');
  x.fillStyle = leke; x.save(); x.scale(1, 1.6); x.fillRect(0, 0, EW, EH / 1.6); x.restore();
  const band = x.createLinearGradient(0, 0.34 * EH, 0, 0.60 * EH);
  band.addColorStop(0, 'rgba(255,237,214,0)'); band.addColorStop(0.5, `rgba(255,237,214,${M.band_guc * 0.8})`); band.addColorStop(1, 'rgba(255,237,214,0)');
  x.fillStyle = band; x.fillRect(0, 0, EW, EH);
  const gok = x.createLinearGradient(0, 0, 0, EH * 0.6);
  gok.addColorStop(0, 'rgba(140,178,255,0.30)'); gok.addColorStop(1, 'rgba(140,178,255,0)');
  x.fillStyle = gok; x.fillRect(0, 0, EW, EH);
  const t = new THREE.CanvasTexture(c); t.flipY = false; t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = true; t.colorSpace = THREE.NoColorSpace;
  return t;
}

/* ---------- yerlesim: sahne konumu, nav hedefi ---------- */
let A = null, sinir = null;                /* amblem.json, sinir.vektor_kutu */
const navLogo = document.getElementById('nvLogo'), navImg = navLogo.querySelector('img'), nv = document.getElementById('nv');
let navRect = null;
const navOlc = () => { navRect = navImg.getBoundingClientRect(); };   /* kurulumda + resize'da + ucusa girerken (halka.ts: iki okuma) */
function sahneYer() { /* {s, tx, ty} birim -> CSS px */
  const w = innerWidth, h = innerHeight, mobil = w <= 900;
  const kutu = mobil ? Math.min(w * YER.mobilKutuW, h * 0.5) : Math.min(h * YER.kutuOran, w * 0.8);
  const s = kutu / KUTU, mx = sinir ? (sinir[0] + sinir[2]) / 2 : KUTU / 2, my = sinir ? (sinir[1] + sinir[3]) / 2 : KUTU / 2;
  return { s, tx: w / 2 - mx * s, ty: (mobil ? YER.mobilV : YER.v) * h - my * s };
}
function navYer() { /* amblemin vektor kutusu -> nav img dikdortgeni */
  if (!navRect || !sinir) return sahneYer();
  const s = navRect.height / (sinir[3] - sinir[1]);
  return { s, tx: navRect.left - sinir[0] * s, ty: navRect.top - sinir[1] * s };
}

/* ---------- durum makinesi ---------- */
let faz = 'A', tA = performance.now(), tB = 0, kabar = 0, cizimP = 0, hazir = false, p = 0, ucusBitti = false;
const yumusat = (t) => t * t * (3 - 2 * t);
function oku() { const ucusPx = P.ucus * innerHeight; p = ucusPx > 0 ? Math.min(1, Math.max(0, scrollY / ucusPx)) : 1; nv.classList.toggle('stuck', scrollY > 8); }
addEventListener('scroll', oku, { passive: true }); oku();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); bgCam.aspect = innerWidth / innerHeight; bgCam.updateProjectionMatrix(); bgYerlestir(); navOlc(); oku(); });

Promise.all([amblemP, sdfP, arkaP]).then(([amb, sdfBm, arkaBm]) => {
  A = amb; sinir = A.sinir.vektor_kutu; yollariKur(A);
  /* SDF: R kanali (webp RGB, uc kanal ayni) */
  const st = new THREE.Texture(sdfBm); st.flipY = false; st.colorSpace = THREE.NoColorSpace; st.minFilter = THREE.LinearFilter; st.magFilter = THREE.LinearFilter;
  st.wrapS = st.wrapT = THREE.ClampToEdgeWrapping; st.generateMipmaps = false; st.needsUpdate = true; U.uSDF.value = st;
  arkaTex = new THREE.Texture(arkaBm); arkaTex.colorSpace = THREE.SRGBColorSpace; arkaTex.needsUpdate = true;
  bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: arkaTex })); bgScene.add(bgMesh); bgYerlestir();
  U.uEnv.value = envKur(arkaBm);
  navOlc(); hazir = true;
  if (AZALT) { faz = 'C'; kabar = 1; cizimP = 1; ciz(1); }
}).catch((e) => yaz('YUKLEME HATASI ' + e.message));

/* ---------- kare ---------- */
let n = 0, t0 = performance.now(), fps = 0, min = 999; const hist = [];
let dogusT = -1;
const Mm = new THREE.Matrix3(), Em = new THREE.Matrix3();
renderer.setAnimationLoop((now) => {
  const z = now / 1000;
  /* Faz A: cizim = min(bayt ilerlemesi, zaman tabani) */
  if (faz === 'A') {
    const bayt = toplamBayt ? yuklenen / toplamBayt : 0;
    const zaman = (now - tA) / 1000 / P.cizimMin;
    cizimP = Math.min(hazir ? 1 : Math.max(bayt, 0.05), zaman);
    if (yollar) ciz(cizimP);
    if (cizimP >= 1 && hazir) { faz = 'B'; tB = now; }
  } else if (faz === 'B') {
    kabar = yumusat(Math.min(1, (now - tB) / 1000 / P.kabarS));
    if (kabar >= 1) faz = 'C';
  }
  /* dogus = isik (metal.ts): kabarmayla birlikte env kazanci ve dip 0->1 */
  U.uKabar.value = kabar; U.uKazanc.value = M.env_kazanc * kabar; U.uDip.value = M.dip * kabar;

  /* arka plan: nefes + ilk kaydirmada asagi/ileri (yer tutucu) */
  if (bgMesh) {
    const nf = (AZALT ? 0 : P.nefes);
    bgCam.position.set(0.004 * Math.sin(z / 5.1) * nf, 0.003 * Math.sin(z / 6.7 + 1) * nf - 0.05 * p, 1 + 0.008 * Math.sin(z / 8.3) * nf - 0.10 * p);
    bgCam.lookAt(bgCam.position.x, bgCam.position.y, 0);
    renderer.clear(); renderer.render(bgScene, bgCam);
  } else renderer.clear();

  /* amblem: yerlesim (sahne -> nav, p ile), salinim (tek saat, pivot uc), huzme */
  if (hazir && !ucusBitti) {
    const a = AZALT ? 0 : (z * 2 * Math.PI) / M.periyot_s;
    const gen = 1 - yumusat(p);                    /* ucusta salinim soner */
    const ex = Math.sin(a) * M.salinim[0] * gen * kabar, ey = Math.sin(a * 0.8) * M.salinim[1] * gen * kabar;
    const S0 = sahneYer(), S1 = navYer(), u = yumusat(p);
    const dpr = renderer.getPixelRatio();
    const s = (S0.s + (S1.s - S0.s) * u) * dpr, tx = (S0.tx + (S1.tx - S0.tx) * u) * dpr, ty = (S0.ty + (S1.ty - S0.ty) * u) * dpr;
    const ux = tx + M.uc[0] * s, uy = ty + M.uc[1] * s, sx = Math.cos(ey), sy = Math.cos(ex);
    Mm.set(s * sx, 0, ux + (tx - ux) * sx, 0, s * sy, uy + (ty - uy) * sy, 0, 0, 1);   /* satir-major set: sutunlar metal.ts Mm ile ayni */
    U.uM.value.copy(Mm);
    const cx = Math.cos(ex), sxn = Math.sin(ex), cy = Math.cos(ey), syn = Math.sin(ey);
    Em.set(cy, sxn * syn, cx * syn, 0, cx, -sxn, -syn, sxn * cy, cx * cy);
    U.uEgim.value.copy(Em);
    U.uEkran.value.set(innerWidth * dpr, innerHeight * dpr);
    U.uPpb.value = s;
    U.uDonus.value = (a * M.env_donus) / (2 * Math.PI) + 0.5 - M.gunes_uv[0];
    const gy = Math.sin(a), gz = Math.cos(a), gl = Math.hypot(gy * 0.8, 0.55, gz * 0.8);
    U.uGunes.value.set((gy * 0.8) / gl, 0.55 / gl, (gz * 0.8) / gl);
    U.uOpak.value = 1;
    renderer.render(amblemScene, bosCam);
    if (p >= 0.999) { ucusBitti = true; navLogo.classList.add('acik'); }   /* oturdu: quad kapanir, navin kendi logosu acilir */
  } else if (ucusBitti && p < 0.999) { ucusBitti = false; navLogo.classList.remove('acik'); }
  not.classList.toggle('gizli', faz !== 'C' || p > 0.02);

  n++; if (now - t0 >= 1000) { fps = n * 1000 / (now - t0); hist.push(fps); if (hist.length > 30) hist.shift(); min = Math.min(...hist); n = 0; t0 = now;
    yaz(`faz ${faz}  çizim ${cizimP.toFixed(2)}  kabar ${kabar.toFixed(2)}  yükleme ${(yuklenen / 1024).toFixed(0)} KB\nkaydırma p ${p.toFixed(3)}${ucusBitti ? '  NAV (quad kapalı, img açık)' : ''}\nfps ${fps.toFixed(0)} (min ${min.toFixed(0)})  ${innerWidth}×${innerHeight}@${devicePixelRatio} dpr ${renderer.getPixelRatio()}\nGPU ${gpuAdi}\n${AZALT ? 'hareket azaltma: fazlar atlandı' : ''}`); }
});
</script>
</body>
</html>
