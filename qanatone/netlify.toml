# QANATONE — Netlify yapilandirmasi
[build]
  # Faz 0 (Astro karari): yeni kabuk dist/yeni altina basar, /yeni/* den
  # yayinlanir. Mevcut site aynen yasar; kok adrese alma Faz 4 un isi.
  command = "npm ci && node build.js && npm --prefix yeni ci && npm --prefix yeni run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Panel govdesi fonksiyon paketine bu satirla giriyor: admin.html artik
# dist e kopyalanmiyor (anonim 200 veriyordu), netlify/functions/panel.js
# onu Basic Auth kapisinin ardindan okuyup servis ediyor. Yol base
# directory ye goredir.
[functions]
  included_files = ["admin.html"]

# Artimli derleme icin onbellek: .onbellek klasoru derlemeler arasinda
# tasinir. Olmazsa her yayinda 58 sayfa bastan render edilir (~100 sn).
[[plugins]]
  package = "/plugins/onbellek"
